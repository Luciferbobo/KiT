model:
  d_model: 768
  n_layers: 13
  n_heads: 6
  ffn_hidden: 2048
  in_features: 5
  rope_theta: 10000.0
  n_registers: 4
  inst_vocab: 4096
  inst_dim: 512
  market_slots: 16
  sector_slots: 64
  scale_slots: 16
  t_emb_dim: 256
  clock_dim: 16
  sess_hidden: 256
  yday_dim: 8
  qk_norm: true
  attn_backend: auto
  use_activation_checkpointing: false
data:
  data_root: ''
  stats_path: ''
  Lc: 1024
  Lh: 128
  trunc_prob: 0.3
  trunc_min: 256
  scale_windows: 1m:1200/120/300,5m:960/96/240,15m:800/64/200,30m:640/40/160,1h:400/20/100,2h:360/20/90,1d:250/20/64
  stride: 0
  scale_strides: 1m:60,5m:48,15m:32,30m:20,1h:10,2h:10,1d:10
  stride_jitter: 0.5
  soft_clip_c: 6.0
  vol_ema_half_life_days: 5.0
  temperature_tau: 0.9
  per_inst_cap: 0
  train_end: '2023-12-31'
  val_start: '2024-01-01'
  val_end: '2024-06-30'
  test_start: '2024-07-01'
  synthetic: false
  cache_max_inst: 64
  raw_1m_root: ''
  agg_timescales: 1m,5m,15m,30m,1h,2h,1d
  agg_workers: 8
train:
  global_batch: 1024
  micro_batch: 32
  lr: 0.0001
  warmup_steps: 2000
  total_steps: 400000
  decay_frac: 0.2
  min_lr: 1.0e-05
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-15
  weight_decay: 0.1
  grad_clip: 1.0
  ema_decay: 0.9999
  precision: bf16
  parallel: fsdp
  fsdp_sharding: grad_op
  inst_dropout: 0.1
  allcond_dropout: 0.05
  hist_dropout: 0.1
  compile: false
  seed: 42
  log_every: 10
  val_every: 1000
  val_batches: 8
  ckpt_every: 1000
  out_dir: runs/default
  resume: ''
infer:
  steps: 32
  solver: euler
  n_paths: 64
  cfg_w: 1.0
  hist_cfg_w: 1.0
